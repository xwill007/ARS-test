name: backend-apprendevr

services:
  db:
    image: mysql:8.0
    container_name: Backend-ApprendeVr
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: ${DB_NAME:-english_vr}
    volumes:
      # Importa el dump completo (schema + datos) del submodule A-frame al arrancar el contenedor
      # por primera vez (mismo patrón que A-frame/docker-dev/docker-compose.yml).
      - ../../A-frame/Proyecto/BaseDatos/english_vr.sql:/docker-entrypoint-initdb.d/01-english_vr.sql:ro
      # Tabla y migraciones propias de ApprendeVr (Requerimiento 010), separadas del dump legacy.
      - ./db/001-user-settings.sql:/docker-entrypoint-initdb.d/02-user-settings.sql:ro
      - ./db/002-evaluation-panel-config.sql:/docker-entrypoint-initdb.d/03-evaluation-panel-config.sql:ro
      - db-data:/var/lib/mysql
    ports:
      - "${DB_PORT:-3306}:3306"

volumes:
  db-data:
    # Nombre fijo: conserva el volumen creado bajo el proyecto compose anterior ("backend") al
    # renombrar el proyecto a "backend-apprendevr", sin perder los datos ya cargados.
    name: backend_db-data
