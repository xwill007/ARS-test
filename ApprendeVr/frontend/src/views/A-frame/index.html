<!DOCTYPE html>
<html>  <head>
    <meta charset="utf-8">
    <link rel="icon" type="image/svg+xml" href="/images/virtual-reality-512-c.png" />
    <title>A-Frame VR Scene</title>

    <script src="/libs/aframe.min.js"></script>
    <script type="module" src="index.js"></script>

    <style>
      .a-enter-vr-button { display: true; }
      .clickable { cursor: pointer; }
    </style>

  </head>
  <body>
    <!-- Volver a la vista de inicio (href relativo: funciona sin importar la IP/host con la que
         se accedió a esta vista, ej. desde start-mobile.sh). Texto ("←" + label) lo completa
         index.js con t('home.backToHome') — ver vrI18n.util.js, regla de proyecto de i18n. -->
    <a id="back-to-home-link" href="/" style="
        position: fixed;
        top: 6px;
        right: 6px;
        z-index: 1000;
        padding: 6px 12px;
        border-radius: 6px;
        background: rgba(0,0,0,0.65);
        color: white;
        font-family: sans-serif;
        font-size: 14px;
        text-decoration: none;
      ">←</a>
    <a-scene>
      <!-- Mundo VR (contiene cielo y piso) -->
      <a-entity
        vr-world="skyColor: black;
                  floorWidth: 100; 
                  floorHeight: 100; 
                  floorTextureRepeatX: 50; 
                  floorTextureRepeatY: 50; 
                  floorRoughness: 0.8; 
                  floorMetalness: 0.2; 
                  floorSrc: /images/piso_ajedrez.jpg">
      </a-entity>      
      
      <!-- Usuario con componente vr-user (incluye cámara y cuerpo) -->
      <a-entity 
                id="user"        
                vr-user="position: 0 0 0; 
                cameraMode: third-person;
                cameraHeight: 1.6; 
                thirdPersonDistance: 3;
                thirdPersonHeight: 1.2;
                thirdPersonAngle: 180;
                enableWASD: true; 
                enableLook: true;                
                reverseMouseDrag: false;
                pointerLockEnabled: true;
                moveSpeed: 0.1;
                moveEnabled: true;
                rotateWithCamera: true;
                rotationSmoothness: 5;
                floorRestricted: true;
                sprintFactor: 2.0;
                bodyHeight: 1.8;
                bodyRadius: 0.3;
                bodyColor: #4CC3D9;
                showBody: true;
                showBodyInFirstPerson: true;
                moveType: cursor;
                fastTurnAngle: 0;
                fastSpeed: 0.5">
      </a-entity>        
      
      

      <!-- Karaoke: lista de canciones + reproductor (incluye VRNewSongAf, ver Requerimiento 009).
           El panel de evaluación (vr-evaluacion-af) no se declara aquí: VRKaraokeAf.js lo crea
           dinámicamente al pulsar "EVALUATE SONG". -->
      <a-entity
        id="karaoke-vr-component"
        vr-karaoke-af="videoPath: /videos/karaoke/StandByMe_BenEKing.mp4;
                videoWidth: 15;
                videoHeight: 9;
                videoList: StandByMe_BenEKing.mp4|Ben E. King|2:58,ItsMyLife_BonJovi.mp4|Bon Jovi|4:25,GangstasParadise_Coolio.mp4|Coolio|3:45;
                textColor: #8a8a96ff;
                buttonColor: #121093ff;
                backgroundColor: #454545ff;
                videoPosition: 0 2.5 -3;
                listPosition: 12.0 6.15 -3;
                escalaLista: 2.2;
                tituloFontScale: 1.4;
                itemFontScale: 1.35"
        position="10 2.5 3">
      </a-entity>

      <!-- Panel para agregar canciones nuevas al catálogo local (ver vrSongCatalog.util.js) -->
      <a-entity
        id="new-song-component"
        vr-new-song-af="position: 0 5 0">
      </a-entity>

      <a-assets>

      </a-assets>

    </a-scene>
  </body>
</html>
